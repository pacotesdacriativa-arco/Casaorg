<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(180deg,#dff4ff,#9fdcff,#74c7ff);
  color:#13415c;
}

.hidden{display:none}

.tela{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
}

.box{
  width:100%;
  max-width:430px;
  background:rgba(255,255,255,.88);
  border-radius:35px;
  padding:35px 25px;
  text-align:center;
  box-shadow:0 15px 35px rgba(0,100,180,.20);
}

.logo{
  font-size:65px;
}

h1,h2{
  text-align:center;
  color:#1f6c99;
}

.sub{
  color:#467ea0;
  font-weight:bold;
  text-align:center;
}

.container{
  max-width:470px;
  margin:auto;
  padding:22px;
}

.card{
  background:rgba(255,255,255,.90);
  border-radius:28px;
  padding:20px;
  margin:18px 0;
  box-shadow:0 10px 25px rgba(0,100,180,.15);
}

button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:18px;
  margin-top:14px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.btn-blue{
  background:linear-gradient(135deg,#58b8ff,#7fd0ff,#bdeaff);
  color:white;
}

.categoria{
  margin-top:18px;
  padding:10px;
  border-radius:16px;
  background:linear-gradient(135deg,#58b8ff,#8ad8ff);
  color:white;
  text-align:center;
  font-weight:bold;
}

.tarefa{
  display:flex;
  align-items:center;
  gap:10px;
  background:#f7fcff;
  border-bottom:1px solid #cbeeff;
  padding:12px 8px;
}

.tarefa input{
  width:22px;
  height:22px;
}

.tarefa.feita{
  opacity:.55;
  text-decoration:line-through;
}

footer{
  text-align:center;
  font-size:12px;
  color:#2b6b8f;
  margin-top:20px;
  font-weight:bold;
}
</style>
</head>

function abrirPlanner(){
document.getElementById("inicio").style.display="none";
document.getElementById("planner").classList.remove("hidden");
renderizar();
}

function renderizar(){
const conteudo = document.getElementById("conteudo");
conteudo.innerHTML="";

Object.keys(rotina).forEach(dia=>{

conteudo.innerHTML += `<div class="card"><h2>${dia}</h2><div id="${dia}"></div></div>`;

const boxDia = document.getElementById(dia);

Object.keys(rotina[dia]).forEach(cat=>{

boxDia.innerHTML += `<div class="categoria">${cat}</div>`;

rotina[dia][cat].forEach((tarefa,index)=>{

const id = `${dia}-${cat}-${index}`;
const salvo = localStorage.getItem(id)==="true";

boxDia.innerHTML += `
<div class="tarefa ${salvo ? "feita" : ""}" id="box-${id}">
<input type="checkbox" ${salvo ? "checked" : ""} onchange="marcar('${id}')">
<span>${tarefa}</span>
</div>
`;

});

});

});
}

function marcar(id){
const checkbox = event.target.checked;
localStorage.setItem(id, checkbox);

const box = document.getElementById("box-"+id);

if(checkbox){
box.classList.add("feita");
}else{
box.classList.remove("feita");
}
}
